name: Mirror upstream Sliver

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sliver-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Mirror upstream repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --mirror https://github.com/BishopFox/sliver.git upstream.git
          git -C upstream.git remote set-url --push origin "https://x-access-token:${GH_TOKEN}@github.com/Mohammad8917/sliver.git"
          git -C upstream.git push --mirror
